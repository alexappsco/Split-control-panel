
name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main  # Deploy only when code is pushed to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install -f

      - name: Build Next.js app
        run: npm run build

      - name: Deploy and Run Post-Build Commands on Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
        run: |
          missing=()
          [ -z "$SSH_PRIVATE_KEY" ] && missing+=("SSH_PRIVATE_KEY")
          [ -z "$SSH_HOST" ] && missing+=("SSH_HOST")
          [ -z "$SSH_USER" ] && missing+=("SSH_USERNAME")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub repository secrets: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          # Configure SSH key for server access
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # SSH into server and run commands
          ssh "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            source ~/.bashrc
            cd /var/www/admin
            git pull
            # Install nvm if not already installed
            if ! command -v nvm &> /dev/null; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.5/install.sh | bash
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            fi
            # Use Node.js 20 and install dependencies
            nvm use 20
            npm install -f
            npm run build
            pm2 restart admin
          EOF
